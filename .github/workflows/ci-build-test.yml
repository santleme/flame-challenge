name: ci-build-test

on:
  push:
  pull_request:

jobs:
  cpp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pybind11
      - name: restore cached C++ build
        uses: actions/cache@v4
        with:
          path: core/build
          key: cpp-build-${{ runner.os }}-py312-${{ hashFiles('core/CMakeLists.txt', 'core/src/**', 'core/bindings/**', 'core/include/**', 'core/tests/**') }}
          restore-keys: cpp-build-${{ runner.os }}-py312-
      - name: build + test C++ core
        run: |
          cd core
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/test_physics

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python data/pipelines/calibrate_constants.py
      - run: python -m pytest data/pipelines/ -q

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest
      - name: restore cached C++ build (shared with cpp-engine job)
        uses: actions/cache@v4
        with:
          path: core/build
          key: cpp-build-${{ runner.os }}-py312-${{ hashFiles('core/CMakeLists.txt', 'core/src/**', 'core/bindings/**', 'core/include/**', 'core/tests/**') }}
          restore-keys: cpp-build-${{ runner.os }}-py312-
      - name: build C++ engine (incremental — near-instant on cache hit)
        run: |
          cd core
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
